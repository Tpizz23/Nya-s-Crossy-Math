<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Nya's Crossy Math</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        #game {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <div id="game"></div>

    <!-- Phaser 3 from CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>

    <!-- Load game files in dependency order -->
    <script src="js/data.js"></script>
    <script src="js/save.js"></script>
    <script src="js/sound.js"></script>
    <script src="js/math.js"></script>

    <!-- Load all scenes -->
    <script src="js/scenes/MainMenuScene.js"></script>
    <script src="js/scenes/CharacterSelectScene.js"></script>
    <script src="js/scenes/SettingsScene.js"></script>
    <script src="js/scenes/OptionsScene.js"></script>
    <script src="js/scenes/GameScene.js"></script>
    <script src="js/scenes/QuizOverlayScene.js"></script>
    <script src="js/scenes/GameOverScene.js"></script>

    <!-- Load config and initialize game -->
    <script src="js/config.js"></script>
</body>
</html>
